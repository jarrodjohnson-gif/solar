[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "solar-finder-3000"
version = "0.1.0"
description = "Solar Finder 3000 — detect solar panels on homes using satellite imagery and YOLOv8"
requires-python = ">=3.10"
dependencies = [
    "ultralytics>=8.0.0",
    "Pillow>=10.0.0",
    "opencv-python>=4.8.0",
    "click>=8.1.0",
    "requests>=2.31.0",
    "geopy>=2.4.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
solar-finder-3000 = "solar_detector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
