[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "solar-detector"
version = "0.1.0"
description = "Detect solar panels on homes using satellite imagery and YOLOv8"
requires-python = ">=3.10"
dependencies = [
    "ultralytics>=8.0.0",
    "Pillow>=10.0.0",
    "opencv-python>=4.8.0",
    "click>=8.1.0",
    "requests>=2.31.0",
    "geopy>=2.4.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
solar-detect = "solar_detector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
